<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Donate eco-friendly clothes to support sustainable fashion.">
    <title>Eco-Friendly Clothing Donation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #e9f7ef;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: rgba(47, 141, 70, 0.8);
            color: #fff;
            padding: 1rem;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px; /* Added space below the header */
        }

        /* Slideshow Styles */
        .banner-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            height: 400px;
            margin-bottom: 30px; /* Space between images and the section */
        }

        .banner-slide {
            width: 33.333%;
            height: 100%;
            position: relative;
        }

        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        section {
            padding: 40px;
            margin: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        form {
            display: grid;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        label {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #333;
        }

        input, textarea {
            padding: 15px;
            font-size: 1rem;
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        input:focus, textarea:focus {
            border-color: #2f8d46;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
            outline: none;
            transform: translateY(-2px);
        }

        button {
            background-color: #2f8d46;
            color: white;
            padding: 15px;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #267c39;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Eco Clothing Donation</h1>
    </header>

    <!-- Static Images -->
    <div class="banner-container">
        <div class="banner-slide">
            <img src="dd1.PNG" alt="Eco Image 1">
        </div>
        <div class="banner-slide">
            <img src="dd2.webp" alt="Eco Image 2">
        </div>
        <div class="banner-slide">
            <img src="dd3.webp" alt="Eco Image 3">
        </div>
    </div>

    <section id="intro">
        <h2>Support Sustainable Fashion</h2>
        <p>Join us in our mission to promote eco-friendly clothing. Your donations help reduce waste and support sustainable living.</p>
    </section>

    <section id="donation-form">
        <h2>Donation Pickup Details</h2>
        <form>
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="contact-number">Your Contact Number</label>
            <input type="tel" id="contact-number" name="contact-number" required>

            <label for="pickup-location">Pickup Location</label>
            <input type="text" id="pickup-location" name="pickup-location" required>

            <label for="pickup-date">Estimated Pickup Date</label>
            <input type="date" id="pickup-date" name="pickup-date" required>

            <label for="donation-details">What Are You Donating?</label>
            <textarea id="donation-details" name="donation-details" rows="4" required></textarea>

            <button type="submit">Submit Pickup Request</button>
        </form>
    </section>
</body>
</html>
